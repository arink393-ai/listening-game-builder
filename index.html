<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>聽力更正遊戲製作工具</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",Arial,"Noto Sans TC",sans-serif;background:#F3EFE9;color:#222;line-height:1.6}
  .wrap{max-width:860px;margin:0 auto;padding:1rem 0.6rem}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit}

  @keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes chipFlash{0%,100%{background:#FCEBEB}40%{background:#F7C1C1}}
  .pop{animation:popIn .32s ease}
  .shake{animation:shake .42s ease}
  .chipFlash{animation:chipFlash .42s ease}

  .card{background:#fff;border:0.5px solid #e5e5e5;border-radius:0 0 12px 12px}
  .head{border-radius:12px 12px 0 0;padding:1rem 1.4rem;color:#fff;background:linear-gradient(135deg,#A32D2D,#7B1F1F)}
  .head .eyebrow{font-size:11px;opacity:.65;margin-bottom:4px}
  .head h1{font-size:19px;font-weight:700;margin:0}
  .head .sub{font-size:12px;opacity:.7;margin-top:3px}

  .grid2{display:grid;grid-template-columns:1fr 320px;gap:1.6rem;padding:1.4rem}
  .fl{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:5px}
  .inp{padding:7px 10px;border:1.5px solid #ddd;border-radius:7px;font-size:13px;outline:none;width:100%}
  textarea.inp{resize:vertical;line-height:1.7}
  .hint{font-size:11px;color:#bbb;margin-top:4px}

  .aibox{background:#f8f8f6;border-radius:8px;padding:10px 12px;font-size:11px;color:#777;line-height:1.9;margin-top:10px}
  .aibox strong{color:#666;display:block;margin-bottom:2px}
  .rowhead{display:grid;grid-template-columns:1fr 1fr 20px;gap:5px;margin-bottom:6px}
  .rowhead span{font-size:10px;color:#bbb;text-align:center}
  .pairs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
  .pairrow{display:grid;grid-template-columns:1fr 1fr 20px;gap:5px;align-items:center}
  .rm{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;padding:0;line-height:1}

  .genRow{text-align:center;margin-top:14px}
  .genBtn{padding:12px 44px;background:#A32D2D;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(163,45,45,.3)}

  .gheader{background:#A32D2D;border-radius:10px 10px 0 0;padding:0.75rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

  .ttsBtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:500;cursor:pointer}

  .gbody{padding:1.25rem 1.5rem;display:grid;grid-template-columns:1fr 165px;gap:1.5rem}
  .article{font-size:15px;line-height:2.8;color:#222}
  .wrongspan{display:inline-block;color:#1a1a1a;font-weight:500;cursor:pointer;border-bottom:2px dashed #aaa;padding:0 2px;border-radius:3px;vertical-align:middle}
  .wrongspan.fixed{color:#2d7d0f;font-weight:700;cursor:default;border-bottom:none}

  .chip{background:#FCEBEB;color:#791F1F;border:1.5px solid #E24B4A;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .12s}

  .chip .lt{font-size:11px;opacity:.5}
  .tip{margin-top:14px;padding:10px 12px;background:#f5f5f3;border-radius:8px;font-size:11px;color:#777;line-height:1.8}
  .ttsNote{text-align:center;padding:0.4rem 0.7rem;font-size:11px;color:#999;min-height:1.2em}

  .ttsBox summary::-webkit-details-marker{display:none}
  .ttsBox summary::before{content:'▸ ';color:#aaa}
  .ttsBox[open] summary::before{content:'▾ '}
  .ttsBox .row{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;margin-top:8px}
  .ttsBox label{font-size:11px;color:#777;white-space:nowrap}
  .ttsBox .inp{font-size:12px;padding:5px 8px}
  .ttsBox .note{font-size:10px;color:#aaa;line-height:1.8;margin-top:8px}
  .status{text-align:center;padding:0.7rem;font-size:13px;color:#666;border-top:1px solid #f0f0f0}
  .status.done{color:#2d7d0f;font-size:15px;font-weight:600}

  @media (max-width:640px){ .grid2,.gbody{grid-template-columns:1fr} }

<body>
<div class="wrap" id="app"></div>

<script>
const $ = id => document.getElementById(id);
const GKEY_LS='meow:gemini_key', GMODEL_LS='meow:gemini_model';

/* ── 語音引擎 ─────────────────────────────────────────────
   三層：本機 Kokoro（最自然）→ Gemini TTS（雲端，沿用同一把金鑰）
   → 瀏覽器內建語音（最後手段）。
   合成結果以文字內容為鍵快取，重播不會重新合成。

   註：原本用瀏覽器內建語音並設 pitch=0.75、rate=0.82，聽起來機械感重——
   內建語音本來就沒有語意層級的抑揚頓挫，機械壓低音高只會更像機器人。
   這裡把 pitch 拿掉，並把慢速交給真正的語音引擎處理。
─────────────────────────────────────────────────────────── */
const TTS_CFG_LS = 'meow:tts_cfg';
const TTS_DEFAULTS = {
  engine: 'auto',                                   // auto | kokoro | gemini | browser
  kokoroUrl: 'http://localhost:8880',
  kokoroVoice: 'af_heart',
  geminiVoice: 'Kore',
  ttsModel: 'gemini-2.5-flash-preview-tts',
  speed: 0.9,
};
let ttsCfg = Object.assign({}, TTS_DEFAULTS);
let lastTtsNote = '';
function loadTtsCfg(){
  try{ const raw = localStorage.getItem(TTS_CFG_LS); if(raw) ttsCfg = Object.assign({}, TTS_DEFAULTS, JSON.parse(raw)); }catch(e){}
  return ttsCfg;
}
function saveTtsCfg(patch){
  ttsCfg = Object.assign({}, ttsCfg, patch);
  try{ localStorage.setItem(TTS_CFG_LS, JSON.stringify(ttsCfg)); }catch(e){}
}
loadTtsCfg();

/* 瀏覽器內建語音：優先挑選 Premium / Enhanced / Neural 這類新一代語音，
   它們的自然度遠高於系統預設的精簡版語音。 */
function pickVoice(voices){
  const en = voices.filter(v => /^en(-|$)/i.test(v.lang));
  const better = en.filter(v => /premium|enhanced|natural|neural|siri/i.test(v.name));
  return better.find(v => v.lang === 'en-US')
    || better[0]
    || en.find(v => /^Google (US|UK) English/i.test(v.name))
    || en.find(v => v.lang === 'en-US')
    || en[0]
    || null;
}

/* 已合成音檔的快取：key = 引擎 + 語音 + 語速 + 文字 */
const ttsCache = new Map();
const ttsKey = t => [ttsCfg.engine, ttsCfg.kokoroVoice, ttsCfg.geminiVoice, ttsCfg.speed, t].join('|~|');

async function kokoroSynth(text){
  const base = (ttsCfg.kokoroUrl || TTS_DEFAULTS.kokoroUrl).replace(/\/$/, '');
  const res = await fetch(base + '/v1/audio/speech', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'kokoro', voice: ttsCfg.kokoroVoice, input: text,
                           response_format: 'mp3', speed: Number(ttsCfg.speed) || 1 }),
  });
  if(!res.ok) throw new Error('Kokoro ' + res.status);
  const blob = await res.blob();
  if(blob.size < 1000) throw new Error('Kokoro 回傳的音檔異常小');
  return blob;
}

/* Gemini TTS 回傳裸 PCM（base64），要自己補上 WAV 檔頭才能播放。 */
function pcmToWav(pcm, sampleRate){
  const buf = new ArrayBuffer(44 + pcm.length), view = new DataView(buf);
  const str = (off, t) => { for(let i = 0; i < t.length; i++) view.setUint8(off + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); view.setUint32(4, 36 + pcm.length, true); str(8, 'WAVE');
  str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, pcm.length, true);
  new Uint8Array(buf, 44).set(pcm);
  return new Blob([buf], { type: 'audio/wav' });
}
async function geminiSynth(text){
  const key = getGeminiKey();
  if(!key) throw new Error('尚未設定 Gemini 金鑰');
  // Gemini TTS 沒有數值語速參數，改用自然語言指示語氣與節奏。
  const pace = Number(ttsCfg.speed) <= 0.85 ? '緩慢清晰地'
             : Number(ttsCfg.speed) <= 0.95 ? '以稍慢的教學語速' : '以自然語速';
  const prompt = '請' + pace + '朗讀以下英文短文，語氣自然、像老師唸給學生聽：\n\n' + text;
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + ttsCfg.ttsModel + ':generateContent', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: {
        responseModalities: ['AUDIO'],
        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: ttsCfg.geminiVoice } } },
      },
    }),
  });
  if(!res.ok){
    let msg = 'Gemini TTS ' + res.status;
    try{ const e = await res.json(); if(e.error && e.error.message) msg = e.error.message; }catch(_){}
    throw new Error(msg);
  }
  const d = await res.json();
  const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
  const part = parts.find(p => p.inlineData);
  if(!part) throw new Error('Gemini 沒有回傳音訊（請確認 TTS 模型名稱是否正確）');
  const bin = atob(part.inlineData.data);
  const pcm = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) pcm[i] = bin.charCodeAt(i);
  const m = String(part.inlineData.mimeType || '').match(/rate=(\d+)/);
  return pcmToWav(pcm, m ? Number(m[1]) : 24000);
}

/* 依設定合成音檔；回傳 null 代表沒有可用的本機／雲端引擎，呼叫端改用瀏覽器語音。 */
async function synthAudio(text){
  const k = ttsKey(text);
  if(ttsCache.has(k)) return ttsCache.get(k);
  const order = ttsCfg.engine === 'auto' ? ['kokoro', 'gemini']
              : ttsCfg.engine === 'browser' ? []
              : [ttsCfg.engine];
  const errors = [];
  lastTtsNote = '';
  for(const eng of order){
    if(eng === 'gemini' && !getGeminiKey()){ errors.push('Gemini：尚未設定金鑰'); continue; }
    try{
      const blob = eng === 'kokoro' ? await kokoroSynth(text) : await geminiSynth(text);
      const out = { url: URL.createObjectURL(blob), blob, engine: eng };
      ttsCache.set(k, out);
      return out;
    }catch(e){ errors.push((eng === 'kokoro' ? 'Kokoro：' : 'Gemini：') + e.message); }
  }
  // 指定了單一引擎卻失敗 → 讓老師看到真正的原因，而不是默默退回機械音
  if(order.length && ttsCfg.engine !== 'auto') throw new Error(errors.join('　'));
  if(errors.length) lastTtsNote = errors.join('　');
  return null;
}

/* 播放控制：優先播放合成音檔，失敗才退回瀏覽器內建語音。 */
function makeTTS(text){
  let playing = false, onChange = () => {}, onStatus = () => {}, audio = null;
  const setPlaying = v => { playing = v; onChange(playing); };

  function browserSpeak(){
    if(!window.speechSynthesis){ onStatus('這個瀏覽器不支援語音播放'); setPlaying(false); return; }
    speechSynthesis.cancel();
    // 內建語音在長文會被瀏覽器截斷，依句子切段依序播放。
    const queue = String(text).match(/[^.!?]+[.!?]*\s*/g) || [text];
    const start = () => {
      const v = pickVoice(speechSynthesis.getVoices());
      let i = 0;
      const next = () => {
        if(!playing || i >= queue.length){ setPlaying(false); return; }
        const utt = new SpeechSynthesisUtterance(queue[i++]);
        utt.lang = 'en-US'; utt.volume = 1;
        utt.rate = Number(ttsCfg.speed) || 0.9;   // 不調 pitch：機械壓低音高只會更像機器人
        if(v) utt.voice = v;
        utt.onend = next;
        utt.onerror = () => setPlaying(false);
        speechSynthesis.speak(utt);
      };
      setPlaying(true); next();
    };
    if(speechSynthesis.getVoices().length) start();
    else speechSynthesis.onvoiceschanged = () => { speechSynthesis.onvoiceschanged = null; start(); };
  }

  function stop(){
    if(audio){ audio.pause(); audio = null; }
    if(window.speechSynthesis) speechSynthesis.cancel();
    setPlaying(false);
  }

  async function toggle(){
    if(playing){ stop(); return; }
    stop();
    let res = null;
    try{
      setPlaying(true); onStatus('正在合成語音…');
      res = await synthAudio(text);
    }catch(e){
      setPlaying(false); onStatus('⚠️ ' + e.message); return;
    }
    if(!res){
      onStatus(lastTtsNote ? '使用瀏覽器內建語音（' + lastTtsNote + '）' : '使用瀏覽器內建語音');
      browserSpeak(); return;
    }
    onStatus('語音來源：' + (res.engine === 'kokoro' ? '本機 Kokoro' : 'Gemini TTS'));
    audio = new Audio(res.url);
    audio.onended = () => { audio = null; setPlaying(false); };
    audio.onerror = () => { audio = null; browserSpeak(); };
    audio.play().catch(() => { audio = null; browserSpeak(); });
  }

  return {
    toggle, stop,
    isPlaying: () => playing,
    onChange: f => { onChange = f; },
    onStatus: f => { onStatus = f; },
    hasAudio: () => ttsCache.has(ttsKey(text)),
    /* 讓老師把合成好的音檔存下來重複使用（同一份教材下次不必重新合成） */
    async download(){
      const res = ttsCache.get(ttsKey(text)) || await synthAudio(text);
      if(!res) throw new Error('目前使用瀏覽器內建語音，沒有可下載的音檔');
      const a = document.createElement('a');
      a.href = res.url;
      a.download = 'listening-' + Date.now() + (res.engine === 'kokoro' ? '.mp3' : '.wav');
      document.body.appendChild(a); a.click(); a.remove();
    },
  };
}

/* ── Segment builder ──────────────────────────────────────── */
function buildSegments(article, pairs){
  const reps=[];
  for(const p of pairs){
    const c=(p.correct||'').trim(), w=(p.wrong||'').trim();
    if(!c||!w) continue;
    const idx=article.toLowerCase().indexOf(c.toLowerCase());
    if(idx!==-1) reps.push({start:idx,end:idx+c.length,correct:c,wrong:w});
  }
  reps.sort((a,b)=>a.start-b.start);
  const segs=[]; let last=0;
  for(const r of reps){
    if(r.start>last) segs.push({type:'text',content:article.slice(last,r.start)});
    segs.push({type:'wrong',content:r.wrong,correct:r.correct,id:'w'+r.start});
    last=r.end;
  }
  if(last<article.length) segs.push({type:'text',content:article.slice(last)});
  return segs;
}

/* ── Gemini（AI 建議干擾字，用你自己的免費金鑰）──────────── */
function getGeminiKey(){ const el=$('geminiKey'); return el?el.value.trim():''; }
function getGeminiModel(){ const el=$('geminiModel'); return el&&el.value?el.value:'gemini-2.5-flash'; }
async function geminiGenerate(text){
  const key=getGeminiKey();
  if(!key) throw new Error('尚未設定 Gemini 金鑰');
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+getGeminiModel()+':generateContent',{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({contents:[{parts:[{text:text}]}],generationConfig:{temperature:0.6,maxOutputTokens:1024}})});
  if(!res.ok){
    let msg='API 錯誤 '+res.status;
    try{ const e=await res.json(); if(e.error&&e.error.message) msg=e.error.message; }catch(_){}
    if(res.status===429) msg='已達免費額度上限，請稍後再試或換 Flash-Lite 模型';
    if(res.status===400||res.status===403) msg='金鑰無效或權限不足，請確認金鑰是否正確';
    throw new Error(msg);
  }
  const d=await res.json();
  const cand=d.candidates&&d.candidates[0];
  const txt=cand&&cand.content&&cand.content.parts?cand.content.parts.map(p=>p.text||'').join(''):'';
  if(!txt) throw new Error('沒有回傳內容');
  return txt;
}
function parseJsonObject(text){
  let t=text.replace(/```json|```/g,'').trim();
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s>=0&&e>s) t=t.slice(s,e+1);
  return JSON.parse(t);
}

/* ============ 狀態 ============ */
let pairs=[{id:1,correct:'',wrong:''},{id:2,correct:'',wrong:''},{id:3,correct:'',wrong:''}];
let nextId=4;
let game=null; // {title,article,segments,pairs}

/* ============ Setup 畫面 ============ */
function renderSetup(){
  const app=$('app');
  app.innerHTML = `
    <div class="head">
      <div class="eyebrow">🎮 聽力更正遊戲製作工具</div>
      <h1>自訂遊戲設定</h1>
      <div class="sub">貼上文章 → 設定單字 → AI 建議干擾字 → 產生遊戲</div>
    </div>
    <div class="card grid2">
      <div>
        <label class="fl">遊戲標題（選填）</label>
        <input class="inp" id="gTitle" placeholder="例：Alex Honnold: Free Solo Taipei 101" style="margin-bottom:14px" />
        <label class="fl">貼上文章 <span style="font-weight:400;color:#aaa">（正確版本 — 即音檔唸的內容）</span></label>
        <textarea class="inp" id="gArticle" placeholder="在這裡貼上完整文章..." rows="12"></textarea>
        <div class="hint" id="wc"></div>

        <label class="fl" style="margin-top:16px">AI 設定（Gemini 免費 API）</label>
        <input class="inp" id="geminiKey" type="password" placeholder="貼上你的 Gemini API 金鑰（AIza...）" autocomplete="off" style="margin-bottom:6px" />
        <select class="inp" id="geminiModel" style="margin-bottom:6px">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash（預設・品質佳）</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite（更快・免費額度高）</option>
        </select>
        <div class="hint">免費申請：到 <a class="keylink" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 登入 Google 帳號 → Create API key，貼上即可。金鑰只存在你自己這台裝置的瀏覽器，不會外傳。</div>
        <details class="ttsBox" id="ttsBox">
          <summary>🔊 語音設定（聽起來不夠自然時調這裡）</summary>
          <div class="row">
            <label>語音引擎</label>
            <select class="inp" id="ttsEngine">
              <option value="auto">自動（本機 Kokoro → Gemini → 瀏覽器）</option>
              <option value="kokoro">本機 Kokoro（最自然・免費）</option>
              <option value="gemini">Gemini TTS（雲端・沿用上面的金鑰）</option>
              <option value="browser">瀏覽器內建語音（最陽春）</option>
            </select>
          </div>
          <div class="row">
            <label>語速</label>
            <select class="inp" id="ttsSpeed">
              <option value="0.8">0.8×（初學者）</option>
              <option value="0.9">0.9×（教學語速）</option>
              <option value="1">1×（自然語速）</option>
            </select>
          </div>
          <div class="row">
            <label>Kokoro 位址</label>
            <input class="inp" id="ttsKokoroUrl" placeholder="http://localhost:8880" />
          </div>
          <div class="row">
            <label>Kokoro 語音</label>
            <input class="inp" id="ttsKokoroVoice" placeholder="af_heart" />
          </div>
          <div class="row">
            <label>Gemini 語音</label>
            <input class="inp" id="ttsGeminiVoice" placeholder="Kore" />
          </div>
          <div class="row">
            <label>Gemini TTS 模型</label>
            <input class="inp" id="ttsModel" placeholder="gemini-2.5-flash-preview-tts" />
          </div>
          <div class="note">
            <b>本機 Kokoro（推薦）</b>：先在終端機執行<br/>
            <code>cd ~/github/Kokoro-FastAPI &amp;&amp; ./start-gpu_mac.sh</code><br/>
            啟動後這裡會自動使用它，免費且不必連網。用完記得關掉。<br/>
            <b>Gemini TTS</b>：不必啟動任何東西，但會消耗上面那把金鑰的額度。<br/>
            學生自己在手機上玩時，通常只會有瀏覽器內建語音——建議先在這裡合成好、按「⬇ 存音檔」下載給學生。
          </div>
        </details>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;font-weight:600;color:#555">設定測驗單字</span>
          <button class="addbtn" id="addPair">＋ 新增</button>
        </div>
        <div class="rowhead"><span>🔊 正確字（音檔）</span><span>📝 干擾字（文章顯示）</span><span></span></div>
        <div class="pairs" id="pairsBox"></div>
        <button class="aiBtn" id="suggestBtn">✨ AI 自動建議干擾字</button>
        <div class="aibox">
          <strong>使用步驟</strong>
          ① 貼上正確版本文章（音檔內容）<br/>
          ② 填入要測驗的正確單字<br/>
          ③ 點 AI 按鈕自動建議干擾字<br/>
          　（或手動填入干擾字）<br/>
          ④ 確認後點「產生遊戲」
        </div>
        <div class="err" id="errBox"></div>
      </div>
    </div>
    <div class="genRow"><button class="genBtn" id="goBtn">▶ 產生遊戲</button></div>
  `;

  try{
    const sk=localStorage.getItem(GKEY_LS); if(sk) $('geminiKey').value=sk;
    const sm=localStorage.getItem(GMODEL_LS); if(sm) $('geminiModel').value=sm;
  }catch(e){}
  $('geminiKey').addEventListener('change',()=>{ try{localStorage.setItem(GKEY_LS,getGeminiKey());}catch(e){} });
  $('geminiModel').addEventListener('change',()=>{ try{localStorage.setItem(GMODEL_LS,getGeminiModel());}catch(e){} });

  // 語音設定：載入目前值，任何變動立即存回 localStorage
  const ttsFields = {
    ttsEngine:'engine', ttsSpeed:'speed', ttsKokoroUrl:'kokoroUrl',
    ttsKokoroVoice:'kokoroVoice', ttsGeminiVoice:'geminiVoice', ttsModel:'ttsModel',
  };
  for(const [id,key] of Object.entries(ttsFields)){
    const el=$(id); if(!el) continue;
    el.value = ttsCfg[key];
    el.addEventListener('change',()=>{
      const v = key==='speed' ? Number(el.value) : el.value.trim() || TTS_DEFAULTS[key];
      if(key!=='speed') el.value = v;
      saveTtsCfg({ [key]: v });
    });
  }

  $('gArticle').addEventListener('input',()=>{
    const n=$('gArticle').value.trim();
    $('wc').textContent = n ? n.split(/\s+/).filter(Boolean).length+' 個字' : '';
  });
  $('addPair').addEventListener('click',()=>{ pairs.push({id:nextId++,correct:'',wrong:''}); renderPairs(); });
  $('goBtn').addEventListener('click',go);
  $('suggestBtn').addEventListener('click',suggestAI);
  renderPairs();
}

function renderPairs(){
  $('pairsBox').innerHTML = pairs.map(p=>`
    <div class="pairrow" data-id="${p.id}">
      <input class="inp pc" placeholder="正確單字" value="${(p.correct||'').replace(/"/g,'&quot;')}" />
      <input class="inp pw" placeholder="干擾字" value="${(p.wrong||'').replace(/"/g,'&quot;')}" />
      <button class="rm">×</button>
    </div>`).join('');
  $('pairsBox').querySelectorAll('.pairrow').forEach(row=>{
    const id=+row.dataset.id;
    row.querySelector('.pc').addEventListener('input',e=>{ const p=pairs.find(x=>x.id===id); if(p) p.correct=e.target.value; });
    row.querySelector('.pw').addEventListener('input',e=>{ const p=pairs.find(x=>x.id===id); if(p) p.wrong=e.target.value; });
    row.querySelector('.rm').addEventListener('click',()=>{ pairs=pairs.filter(x=>x.id!==id); renderPairs(); });
  });
}

function showError(msg){ const e=$('errBox'); if(!msg){ e.style.display='none'; e.textContent=''; return; } e.style.display='block'; e.textContent='⚠️ '+msg; }

async function suggestAI(){
  const article=$('gArticle').value;
  const corrects=pairs.map(p=>p.correct.trim()).filter(Boolean);
  if(!corrects.length||!article.trim()){ showError('請先填入文章和至少一個正確單字'); return; }
  if(!getGeminiKey()){ showError('請先在左側貼上 Gemini API 金鑰'); return; }
  const btn=$('suggestBtn'); btn.disabled=true; btn.textContent='✨ AI 思考中…'; showError('');
  try{
    const prompt = `You are creating a listening comprehension exercise. Given an English article and target words, suggest ONE plausible but DIFFERENT synonym or alternative word/phrase for each target. The alternative must:
- Sound natural in the same context
- Use DIFFERENT vocabulary from the original
- Keep the same part of speech (noun→noun, verb→verb, etc.)
- For multi-word phrases, suggest a similar phrase

Article:
${article}

Target words: ${corrects.join(', ')}

Respond ONLY with a valid JSON object, no markdown, no explanation:
{"word1":"distractor1","word2":"distractor2"}`;
    const text = await geminiGenerate(prompt);
    const obj = parseJsonObject(text);
    pairs = pairs.map(pair=>{
      const k=pair.correct.trim();
      return obj[k] ? {...pair, wrong:obj[k]} : pair;
    });
    renderPairs();
  }catch(e){ showError(e.message||'AI 建議失敗，請手動填入干擾字'); }
  btn.disabled=false; btn.textContent='✨ AI 自動建議干擾字';
}

function go(){
  const title=$('gTitle').value;
  const article=$('gArticle').value;
  const validPairs=pairs.filter(p=>p.correct.trim()&&p.wrong.trim());
  if(!article.trim()){ showError('請填入文章'); return; }
  if(!validPairs.length){ showError('請至少設定一組單字（正確字 + 干擾字）'); return; }
  const segs=buildSegments(article,validPairs);
  const notFound=validPairs.filter(p=>!segs.some(s=>s.type==='wrong'&&s.correct.toLowerCase()===p.correct.trim().toLowerCase()));
  if(notFound.length){ showError('以下單字在文章中找不到：'+notFound.map(p=>p.correct).join('、')); return; }
  showError('');
  game={title,article,segments:segs,pairs:validPairs};
  renderGame();
}

/* ============ Game 畫面 ============ */
function renderGame(){
  const app=$('app');
  const tts=makeTTS(game.article);
  let fixed={}, selIdx=null;

  app.innerHTML = `
    <div class="gheader">
      <div><div class="eyebrow">聽力更正遊戲</div><div class="gtitle">${escapeHtml(game.title||'聽力遊戲')}</div></div>
      <div class="ghead-btns">
        <button class="ttsBtn" id="ttsBtn">▶ 播放全文</button>
        <button class="ttsBtn" id="dlBtn" title="將合成好的音檔存檔，下次不必重新合成">⬇ 存音檔</button>
        <button class="backBtn" id="backBtn">← 重新設定</button>
      </div>
    </div>
    <div class="card gbody">
      <div class="article" id="articleBox"></div>
      <div>
        <div class="bankhead">Word Bank</div>
        <div id="bankBox" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="tip">① 播放音檔仔細聆聽<br/>② 找出文章中<br/>　與音檔不同的字<br/>③ 選正確字拖到<br/>　錯誤字上更正</div>
      </div>
    </div>
    <div class="ttsNote" id="ttsNote"></div>
    <div class="status" id="statusBox"></div>
  `;

  $('backBtn').addEventListener('click',()=>{ tts.stop(); game=null; renderSetup(); });
  $('ttsBtn').addEventListener('click',()=>{ tts.toggle(); });
  $('dlBtn').addEventListener('click',async()=>{
    $('ttsNote').textContent='正在準備音檔…';
    try{ await tts.download(); $('ttsNote').textContent='音檔已下載'; }
    catch(e){ $('ttsNote').textContent='⚠️ '+e.message; }
  });
  tts.onStatus(msg=>{ $('ttsNote').textContent = msg || ''; });
  tts.onChange(playing=>{
    const b=$('ttsBtn');
    b.classList.toggle('on',playing);
    b.textContent = playing ? '⏸ 停止' : '▶ 播放全文';
  });

  function usedCorrects(){ return new Set(Object.values(fixed).map(v=>v.toLowerCase())); }

  function tryFix(segId, correct){
    if(selIdx===null) return;
    const chip=game.pairs[selIdx];
    if(!chip) return;
    if(chip.correct.trim().toLowerCase()===correct.toLowerCase()){
      fixed[segId]=chip.correct.trim();
      selIdx=null;
      renderArticle(); renderBank(); renderStatus();
    } else {
      const span=document.querySelector('[data-seg="'+segId+'"]');
      const chipEl=document.querySelector('[data-chip="'+selIdx+'"]');
      if(span){ span.classList.add('shake'); setTimeout(()=>span.classList.remove('shake'),450); }
      if(chipEl){ chipEl.classList.add('chipFlash'); setTimeout(()=>chipEl.classList.remove('chipFlash'),450); }
    }
  }

  function renderArticle(){
    const box=$('articleBox');
    box.innerHTML = game.segments.map(seg=>{
      if(seg.type==='text') return `<span>${escapeHtml(seg.content)}</span>`;
      const isFixed=!!fixed[seg.id];
      return `<span class="wrongspan${isFixed?' fixed pop':''}" data-seg="${seg.id}" data-correct="${escapeHtml(seg.correct)}">${escapeHtml(isFixed?fixed[seg.id]:seg.content)}</span>`;
    }).join('');
    box.querySelectorAll('.wrongspan').forEach(el=>{
      if(el.classList.contains('fixed')) return;
      el.addEventListener('click',()=>tryFix(el.dataset.seg, el.dataset.correct));
      el.addEventListener('dragover',e=>e.preventDefault());
      el.addEventListener('drop',e=>{ e.preventDefault(); tryFix(el.dataset.seg, el.dataset.correct); });
    });
  }

  function renderBank(){
    const used=usedCorrects();
    const box=$('bankBox');
    const letters='abcdefghijklmnop';
    box.innerHTML = game.pairs.map((p,i)=>{
      const isUsed=used.has(p.correct.trim().toLowerCase());
      const isSel=selIdx===i;
      return `<div class="chip${isSel?' sel':''}${isUsed?' used':''}" data-chip="${i}" draggable="${isUsed?'false':'true'}"><span class="lt">${letters[i]||''}</span>${escapeHtml(p.correct.trim())}</div>`;
    }).join('');
    box.querySelectorAll('.chip').forEach(el=>{
      const i=+el.dataset.chip;
      if(el.classList.contains('used')) return;
      el.addEventListener('click',()=>{ selIdx = selIdx===i ? null : i; renderBank(); });
      el.addEventListener('dragstart',e=>{ selIdx=i; e.dataTransfer.effectAllowed='move'; renderBank(); });
    });
  }

  function renderStatus(){
    const score=Object.keys(fixed).length, total=game.pairs.length;
    const box=$('statusBox');
    if(score===total){ box.className='status done'; box.textContent='全部更正完畢！聽力超強！🎉'; }
    else { box.className='status'; box.innerHTML='已更正 <strong>'+score+' / '+total+'</strong> 個錯誤'; }
  }

  renderArticle(); renderBank(); renderStatus();
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

renderSetup();
</script>
